<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 졸업각</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a7f45'/%3E%3Cpath d='M8 8l10 8M8 24l10-8h7' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-wrap { max-width: 380px; margin: 10vh auto; padding: 0 20px; }
    .auth-card { background: var(--card, #fff); border: 1px solid rgba(0,0,0,.08); border-radius: 16px; padding: 28px 24px; }
    .auth-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; margin-bottom: 4px; }
    .auth-brand .mark { width: 28px; height: 28px; }
    .auth-brand .mark path { stroke: #1a7f45; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .auth-brand .mark circle { fill: #1a7f45; }
    .auth-sub { color: #6b7280; font-size: 14px; margin: 0 0 20px; }
    .auth-tabs { display: flex; gap: 6px; margin-bottom: 18px; }
    .auth-tabs button { flex: 1; padding: 9px; border: 1px solid rgba(0,0,0,.12); background: transparent; border-radius: 9px; cursor: pointer; font: inherit; }
    .auth-tabs button[aria-selected="true"] { background: #1a7f45; color: #fff; border-color: #1a7f45; }
    .auth-field { display: block; margin-bottom: 14px; }
    .auth-field span { display: block; font-size: 13px; margin-bottom: 6px; color: #374151; }
    .auth-field input { width: 100%; padding: 11px 12px; border: 1px solid rgba(0,0,0,.15); border-radius: 9px; font: inherit; box-sizing: border-box; }
    .auth-submit { width: 100%; padding: 12px; border: 0; border-radius: 9px; background: #1a7f45; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .auth-submit:disabled { opacity: .6; cursor: default; }
    .auth-msg { margin: 14px 0 0; font-size: 14px; min-height: 20px; }
    .auth-msg.err { color: #c0392b; }
    .auth-msg.ok { color: #1a7f45; }
    .auth-me { font-size: 14px; }
    .auth-me a { color: #1a7f45; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 7l11 9M6 25l11-9h9"/><circle cx="26" cy="16" r="2.6"/></svg>
        <span>졸업각</span>
      </div>
      <p class="auth-sub">이메일로 로그인하고 진단을 저장해 보세요.</p>

      <div id="loggedOut">
        <div class="auth-tabs" role="tablist">
          <button id="tabLogin" role="tab" aria-selected="true">로그인</button>
          <button id="tabSignup" role="tab" aria-selected="false">회원가입</button>
        </div>

        <form id="authForm">
          <label class="auth-field">
            <span>이메일</span>
            <input type="email" id="email" autocomplete="email" required>
          </label>
          <label class="auth-field">
            <span>비밀번호</span>
            <input type="password" id="password" autocomplete="current-password" required>
          </label>
          <button class="auth-submit" type="submit" id="submitBtn">로그인</button>
        </form>
      </div>

      <div id="loggedIn" hidden>
        <p class="auth-me"><strong id="meEmail"></strong> 님으로 로그인했어요.</p>
        <p class="auth-me"><a href="/">홈으로 가기</a></p>
        <button class="auth-submit" type="button" id="logoutBtn" style="margin-top:14px;background:#6b7280;">로그아웃</button>
      </div>

      <p class="auth-msg" id="msg" role="status"></p>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let mode = 'login';

    function setMode(next) {
      mode = next;
      $('tabLogin').setAttribute('aria-selected', String(mode === 'login'));
      $('tabSignup').setAttribute('aria-selected', String(mode === 'signup'));
      $('submitBtn').textContent = mode === 'login' ? '로그인' : '회원가입';
      $('password').setAttribute('autocomplete', mode === 'login' ? 'current-password' : 'new-password');
      say('');
    }

    // 상단바 '회원가입' 버튼은 /login.html?mode=signup으로 온다.
    addEventListener('DOMContentLoaded', () => {
      if (new URLSearchParams(location.search).get('mode') === 'signup') setMode('signup');
    });

    function say(text, kind) {
      const el = $('msg');
      el.textContent = text;
      el.className = 'auth-msg' + (kind ? ' ' + kind : '');
    }

    function showLoggedIn(user) {
      $('loggedOut').hidden = true;
      $('loggedIn').hidden = false;
      $('meEmail').textContent = user.email;
    }

    $('tabLogin').addEventListener('click', () => setMode('login'));
    $('tabSignup').addEventListener('click', () => setMode('signup'));

    $('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('submitBtn').disabled = true;
      say('');
      try {
        const res = await fetch('/api/auth/' + mode, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email: $('email').value, password: $('password').value }),
        });
        const data = await res.json();
        if (!res.ok) {
          say(data.error || '문제가 생겼어요.', 'err');
        } else {
          showLoggedIn(data.user);
          say(mode === 'signup' ? '가입이 끝났어요.' : '로그인했어요.', 'ok');
        }
      } catch {
        say('네트워크 오류가 났어요.', 'err');
      } finally {
        $('submitBtn').disabled = false;
      }
    });

    $('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      $('loggedIn').hidden = true;
      $('loggedOut').hidden = false;
      say('로그아웃했어요.', 'ok');
    });

    // 이미 로그인되어 있으면 상태 반영
    fetch('/api/auth/me').then((r) => r.json()).then((d) => {
      if (d.user) showLoggedIn(d.user);
    });
  </script>
</body>
</html>
